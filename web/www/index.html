<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>CifRust</title>
	<script type="module" src="main.js"></script>
	<link rel="stylesheet" href="style.css">
</head>

<body>

	<div id="main_div">
		<div id="input_div">
			<button id="randomize_button" class="full-row">Generate random numbers</button>
			<input id="n1" class="number_input" value="1">
			<input id="n2" class="number_input" value="1">
			<input id="n3" class="number_input" value="1">
			<input id="n4" class="number_input" value="1">
			<input id="n5" class="number_input" value="1">
			<input id="n6" class="number_input" value="1">
			<div id="target_div">
				Target: <input id="target_input" value="100">
			</div>
			<button id="calculate_button">Calculate!</button>
		</div>
		<div id="result_div"></div>
	</div>

<!-- Error pop-up -->
<div id="error_overlay"></div>
<div id="error_box">
    <p id="error_message_text">Error desconocido</p>
</div>

</body>
